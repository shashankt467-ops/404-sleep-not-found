<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEALIX — Emergency Information Interoperability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050914;
  --ink-soft:#0A1428;
  --teal:#00F0FF;
  --teal-deep:#0AB4C4;
  --magenta:#FF2E9A;
  --amber:#FFB020;
  --red:#FF3B4E;
  --red-bg:rgba(255,59,78,.14);
  --green:#39FF9A;
  --green-bg:rgba(57,255,154,.12);
  --bg:#050914;
  --bg2:#0A1428;
  --card:rgba(13,22,42,.78);
  --card-solid:#0D162A;
  --line:rgba(0,240,255,.22);
  --line-soft:rgba(0,240,255,.10);
  --text:#EAF6FF;
  --text-mute:#7FA0C0;
  --text-faint:#4B6580;
  --focus:#00F0FF;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --font-display:'Orbitron',sans-serif;
  --font-body:'Rajdhani',sans-serif;
  --font-mono:'Share Tech Mono',ui-monospace,monospace;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(0,240,255,.10), transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(255,46,154,.09), transparent 45%),
    repeating-linear-gradient(0deg, rgba(0,240,255,.035) 0px, rgba(0,240,255,.035) 1px, transparent 1px, transparent 42px),
    repeating-linear-gradient(90deg, rgba(0,240,255,.035) 0px, rgba(0,240,255,.035) 1px, transparent 1px, transparent 42px),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:500;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,240,255,.018) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode:overlay;
}
.mono{font-family:var(--font-mono);letter-spacing:.02em;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.02em;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(0,240,255,.25);}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
}
::selection{background:var(--teal);color:#000;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--teal),var(--magenta));border-radius:6px;}
input,select,textarea{
  font-family:var(--font-body);
  font-size:15px;
  background:rgba(0,240,255,.05);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:10px 12px;
}
select{
  background-color:#0A1428;
  color:#EAF6FF;
}
select option{
  background-color:#0D162A !important;
  color:#EAF6FF !important;
  font-size:14px;
  padding:8px 12px;
}
select option:hover, select option:checked{
  background-color:#00F0FF !important;
  color:#001217 !important;
}
input::placeholder{color:var(--text-faint);}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid transparent;border-radius:var(--radius-sm);
  padding:10px 18px;font-size:13.5px;font-weight:700;
  font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;
  transition:box-shadow .18s ease, border-color .18s ease, transform .05s ease, background .18s ease;
  background:none;color:var(--text);
}
.btn:active{transform:translateY(1px) scale(.98);}
.btn-primary{background:linear-gradient(120deg,var(--teal),var(--teal-deep));color:#001217;box-shadow:0 0 18px rgba(0,240,255,.45), inset 0 0 0 1px rgba(255,255,255,.25);}
.btn-primary:hover{box-shadow:0 0 30px rgba(0,240,255,.75), inset 0 0 0 1px rgba(255,255,255,.35);}
.btn-outline{border-color:var(--line);color:var(--teal);background:rgba(0,240,255,.04);}
.btn-outline:hover{border-color:var(--teal);box-shadow:0 0 14px rgba(0,240,255,.35);}
.btn-ghost{color:var(--text-mute);}
.btn-ghost:hover{color:var(--teal);}
.btn-danger{background:linear-gradient(120deg,var(--red),#B3182B);color:#fff;box-shadow:0 0 18px rgba(255,59,78,.5);animation:dangerpulse 1.8s ease-in-out infinite;}
.btn-danger:hover{box-shadow:0 0 30px rgba(255,59,78,.85);}
@keyframes dangerpulse{0%,100%{box-shadow:0 0 12px rgba(255,59,78,.45);}50%{box-shadow:0 0 26px rgba(255,59,78,.85);}}
.btn:disabled{opacity:.4;cursor:not-allowed;animation:none;box-shadow:none;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line);font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;
}
.badge-green{background:var(--green-bg);color:var(--green);border-color:rgba(57,255,154,.4);box-shadow:0 0 10px rgba(57,255,154,.25);}
.badge-red{background:var(--red-bg);color:var(--red);border-color:rgba(255,59,78,.5);box-shadow:0 0 12px rgba(255,59,78,.35);animation:badgepulse 1.4s ease-in-out infinite;}
.badge-amber{background:rgba(255,176,32,.12);color:var(--amber);border-color:rgba(255,176,32,.4);box-shadow:0 0 10px rgba(255,176,32,.25);}
@keyframes badgepulse{0%,100%{box-shadow:0 0 8px rgba(255,59,78,.35);}50%{box-shadow:0 0 20px rgba(255,59,78,.7);}}
.card{
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px;
  position:relative;
  box-shadow:0 0 0 1px rgba(0,240,255,.03), 0 18px 40px rgba(0,0,0,.35);
}
.card::before{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,240,255,.7),transparent);
}
.small{font-size:12.5px;color:var(--text-mute);}
.faint{color:var(--text-faint);}

/* Shell & Navigation */
#app{min-height:100vh;position:relative;z-index:1;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:260px;flex-shrink:0;background:linear-gradient(180deg,#050914,#0A1428);color:#B7D6E8;
  display:flex;flex-direction:column;padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);
}
.sb-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.sb-logo .mark{
  width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--magenta));
  display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-family:var(--font-display);font-size:14px;
  box-shadow:0 0 20px rgba(0,240,255,.5);
}
.sb-logo .name{font-weight:800;font-size:16px;color:#fff;line-height:1.1;font-family:var(--font-display);letter-spacing:.05em;}
.sb-logo .sub{font-size:9.5px;color:var(--teal);letter-spacing:.12em;font-family:var(--font-mono);}
.sb-nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;flex:1;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;
  font-size:13px;font-weight:600;color:#8FADC4;background:none;border:none;border-left:2px solid transparent;text-align:left;width:100%;
  transition:all .15s ease;
}
.sb-item:hover{background:rgba(0,240,255,.06);color:#fff;border-left-color:var(--teal-deep);}
.sb-item.active{background:rgba(0,240,255,.1);color:var(--teal);border-left-color:var(--teal);box-shadow:inset 0 0 20px rgba(0,240,255,.08);}
.sb-item svg{flex-shrink:0;}
.sb-foot{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:8px;font-size:12.5px;}
.sb-foot .who{color:#fff;font-weight:700;font-family:var(--font-display);font-size:13px;}
.sb-foot .role{color:var(--teal);font-family:var(--font-mono);font-size:11px;}
.sb-foot .status{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--green);font-size:11px;font-family:var(--font-mono);}
.sb-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
.sb-logout{margin-top:10px;font-size:11.5px;font-family:var(--font-mono);color:#8FADC4;background:none;border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px;width:100%;text-align:left;}
.sb-logout:hover{border-color:var(--red);color:var(--red);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 26px;border-bottom:1px solid var(--line);background:rgba(5,9,20,.8);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:5;
}
.topbar .left{display:flex;align-items:center;gap:14px;}
.topbar .brand{font-weight:800;font-size:15px;font-family:var(--font-display);letter-spacing:.06em;background:linear-gradient(90deg,var(--teal),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
.topbar .tagline{font-size:11.5px;color:var(--text-mute);border-left:1px solid var(--line);padding-left:14px;font-family:var(--font-mono);}
.topbar .right{display:flex;align-items:center;gap:14px;}
.pill{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--text-mute);
  font-family:var(--font-mono);
}
.pill.ok{color:var(--green);border-color:rgba(57,255,154,.4);background:var(--green-bg);}
.em-toggle{
  display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  padding:6px 14px;border-radius:999px;border:1px solid var(--red);color:var(--red);background:none;
  font-family:var(--font-display);letter-spacing:.04em;
}
.em-toggle.on{background:var(--red);color:#fff;box-shadow:0 0 20px rgba(255,59,78,.6);animation:dangerpulse 1.2s ease-in-out infinite;}
.content{padding:28px;max-width:1240px;width:100%;margin:0 auto;flex:1;}

/* Landing */
.landing{min-height:100vh;background:var(--bg);color:#E9F0F3;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.landing::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,240,255,.14), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,46,154,.12), transparent 40%);
  pointer-events:none;
}
.landing-nav{display:flex;justify-content:space-between;align-items:center;padding:22px 6vw;position:relative;z-index:1;}
.landing-hero{padding:60px 6vw 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative;z-index:1;}
@media(max-width:880px){.landing-hero{grid-template-columns:1fr;padding-top:20px;}}
.landing-hero h1{font-size:clamp(30px,4.6vw,48px);line-height:1.1;font-weight:900;color:#fff;text-transform:uppercase;
  background:linear-gradient(100deg,#fff 30%,var(--teal) 60%,var(--magenta) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.landing-hero .lead{font-size:17px;color:#B7D6E8;margin-top:18px;max-width:540px;line-height:1.5;font-weight:600;}
.landing-hero .desc{font-size:14px;color:var(--text-mute);margin-top:14px;max-width:540px;line-height:1.6;}
.landing-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
.landing-checks{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:34px;max-width:560px;}
.landing-checks div{display:flex;align-items:center;gap:8px;font-size:13px;color:#CBD8E0;font-family:var(--font-mono);}
.landing-panel{background:rgba(10,20,40,.6);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 0 40px rgba(0,240,255,.08);}
.landing-panel .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px;font-family:var(--font-mono);}
.landing-panel .row:last-child{border-bottom:none;}
.landing-panel .row .k{color:var(--text-mute);}
.landing-panel .row .v{color:var(--green);font-weight:700;}
.landing-foot{margin-top:auto;padding:22px 6vw;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--text-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--font-mono);position:relative;z-index:1;}

/* Auth & Forms */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;position:relative;overflow:hidden;}
.auth-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, rgba(0,240,255,.14), transparent 55%);pointer-events:none;}
.auth-card{width:100%;max-width:480px;background:var(--card);backdrop-filter:blur(14px);border-radius:18px;padding:34px 30px;border:1px solid var(--line);position:relative;z-index:1;box-shadow:0 0 60px rgba(0,240,255,.15);}
.auth-head{text-align:left;margin-bottom:22px;}
.auth-head h1{font-size:22px;}
.auth-head p{font-size:12.5px;color:var(--text-mute);margin-top:6px;font-family:var(--font-mono);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px;color:var(--teal);font-family:var(--font-mono);letter-spacing:.03em;text-transform:uppercase;}
.field input, .field select, .field textarea{width:100%;}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.role-opt{border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:700;background:rgba(0,240,255,.03);color:var(--text-mute);font-family:var(--font-mono);}
.role-opt.sel{border-color:var(--teal);color:var(--teal);background:var(--green-bg);box-shadow:0 0 14px rgba(0,240,255,.3);}
.auth-opts{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
.auth-opts .op{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px;font-weight:700;text-align:center;color:var(--text-mute);font-family:var(--font-mono);}
.auth-opts .op.sel{border-color:var(--teal);color:var(--teal);box-shadow:0 0 12px rgba(0,240,255,.3);}

/* Grids & Cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.stat-card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;}
.stat-card::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,240,255,.7),transparent);}
.stat-card:hover{box-shadow:0 0 24px rgba(0,240,255,.25);transform:translateY(-2px);}
.stat-card .lbl{font-size:11px;color:var(--text-mute);font-weight:700;font-family:var(--font-mono);letter-spacing:.03em;text-transform:uppercase;}
.stat-card .num{font-size:32px;font-weight:800;margin-top:6px;font-family:var(--font-display);color:var(--teal);text-shadow:0 0 16px rgba(0,240,255,.5);}
.stat-card .delta{font-size:11px;margin-top:4px;color:var(--text-faint);font-family:var(--font-mono);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h2{font-size:16px;letter-spacing:.03em;}
.section-title .sub{font-size:12px;color:var(--text-mute);margin-top:2px;font-family:var(--font-mono);}
.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.source-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);backdrop-filter:blur(8px);}
.source-card .name{font-weight:700;font-size:13px;}
.source-card .meta{font-size:11px;color:var(--text-mute);margin-top:4px;font-family:var(--font-mono);}
.two-col{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.stack{display:flex;flex-direction:column;gap:16px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:16px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;color:var(--teal);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase;}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
tr:hover td{background:rgba(0,240,255,.04);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

/* Search & Progress */
.search-hero{
  background:linear-gradient(155deg,var(--ink) 0%,var(--ink-soft) 60%, #14203A 130%);
  border:1px solid var(--line);
  border-radius:18px;padding:32px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 0 50px rgba(0,240,255,.1);
}
.search-hero::before{content:'';position:absolute;top:-40%;right:-10%;width:340px;height:340px;background:radial-gradient(circle,rgba(0,240,255,.16),transparent 65%);pointer-events:none;}
.search-hero h2{color:#fff;font-size:21px;}
.search-hero p{color:#9FB0C4;font-size:13px;margin-top:6px;}
.search-tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap;}
.search-tab{font-size:11px;font-weight:700;padding:7px 13px;border-radius:999px;background:rgba(0,240,255,.06);color:#9FB0C4;border:1px solid var(--line);font-family:var(--font-mono);}
.search-tab.sel{background:var(--teal);color:#001217;border-color:var(--teal);box-shadow:0 0 14px rgba(0,240,255,.5);}
.search-box{display:flex;gap:10px;margin-top:14px;}
.search-box input{flex:1;background:rgba(0,240,255,.06);border:1px solid var(--line);color:#fff;font-family:var(--font-mono);}
.progress-list{display:flex;flex-direction:column;gap:0;}
.progress-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;font-family:var(--font-mono);}
.progress-item:last-child{border-bottom:none;}
.progress-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--text-faint);}
.progress-item.done .progress-dot{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 10px var(--green);}
.progress-item.active .progress-dot{border-color:var(--teal);color:var(--teal);animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 12px var(--teal);}
.progress-item.done{color:var(--text-mute);}
.progress-item.active{color:var(--teal);font-weight:700;}

/* Conflict & Summary */
.conflict-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card);backdrop-filter:blur(8px);}
.conflict-card.sev-critical{border-left:4px solid var(--red);box-shadow:0 0 24px rgba(255,59,78,.18);}
.conflict-card.sev-high{border-left:4px solid var(--amber);}
.conflict-card.sev-medium{border-left:4px solid #D9A441;}
.conflict-card.sev-low{border-left:4px solid var(--text-faint);}
.conflict-vals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.conflict-val{background:rgba(0,240,255,.04);border-radius:8px;padding:10px 12px;font-size:13px;}
.conflict-val .src{font-size:10.5px;color:var(--text-mute);margin-bottom:3px;font-family:var(--font-mono);}

.em-header{
  border-radius:16px;padding:24px;background:linear-gradient(135deg,var(--red-bg),var(--card));
  border:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;
  box-shadow:0 0 40px rgba(255,59,78,.1);
}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px;}
.crit-item{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:14px;transition:box-shadow .2s ease;}

<script>
/* ============================= API CLIENT ============================= */
const API = {
  token: localStorage.getItem('hc04_token') || '',
  refreshToken: localStorage.getItem('hc04_refresh') || '',

  async req(url, options = {}) {
    options.headers = options.headers || {};
    if (this.token) {
      options.headers['Authorization'] = `Bearer ${this.token}`;
    }
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(options.body);
    }
    try {
      const res = await fetch(url, options);
      if (res.status === 401 && this.refreshToken && !url.includes('/auth/login') && !url.includes('/auth/refresh')) {
        // Attempt token rotation
        const refreshed = await this.rotateToken();
        if (refreshed) {
          options.headers['Authorization'] = `Bearer ${this.token}`;
          return await fetch(url, options);
        }
      }
      return res;
    } catch (err) {
      console.error('Network error calling', url, err);
      throw err;
    }
  },

  async rotateToken() {
    try {
      const res = await fetch('/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: this.refreshToken })
      });
      if (res.ok) {
        const data = await res.json();
        this.setTokens(data.access_token, this.refreshToken);
        return true;
      }
    } catch (e) {}
    this.clearTokens();
    return false;
  },

  setTokens(acc, ref) {
    this.token = acc;
    if (ref) this.refreshToken = ref;
    localStorage.setItem('hc04_token', acc);
    if (ref) localStorage.setItem('hc04_refresh', ref);
  },

  clearTokens() {
    this.token = '';
    this.refreshToken = '';
    localStorage.removeItem('hc04_token');
    localStorage.removeItem('hc04_refresh');
  }
};

/* ============================= PURE JS QR GENERATOR ============================= */
function renderQRCodeSVG(text, size = 120) {
  // Generates clean deterministic matrix pattern based on token hash
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash) + text.charCodeAt(i);
  const n = 21;
  const cellSize = size / n;
  let rects = '';
  
  // Standard position detection corners
  const isCorner = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= 14) || (r >= 14 && c < 7);
  
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      let filled = false;
      if (isCorner(r, c)) {
        if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) filled = true;
        if (r === 0 || r === 6 || c === 14 || c === 20 || (r >= 2 && r <= 4 && c >= 16 && c <= 18)) filled = true;
        if (r === 14 || r === 20 || c === 0 || c === 6 || (r >= 16 && r <= 18 && c >= 2 && c <= 4)) filled = true;
      } else {
        const seed = Math.sin((r * n + c + Math.abs(hash)) * 13.37);
        filled = (seed - Math.floor(seed)) > 0.45;
      }
      if (filled) {
        rects += `<rect x="${c * cellSize}" y="${r * cellSize}" width="${cellSize}" height="${cellSize}" fill="#050914" />`;
      }
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border-radius:6px;padding:6px;">${rects}</svg>`;
}

/* ============================= INITIALIZATION & FETCHERS ============================= */
async function initApp() {
  try {
    if (API.token) {
      const meRes = await API.req('/api/auth/me');
      if (meRes.ok) {
        const user = await meRes.json();
        state.user = user;
        state.role = user.role;
        state.screen = 'app';
        state.view = user.role === 'PATIENT' ? 'myhealth' : 'dashboard';
        if (user.role === 'PATIENT') fetchPatientPortal(user.id);
        else {
          fetchStats();
          fetchPatients();
        }
        render();
        return;
      }
    }
  } catch (e) {
    console.warn('Initial session check error', e);
  }
  fetchSources();
  fetchStats();
  render();
}

/* ============================= AUTH ACTIONS ============================= */
async function submitLogin() {
  state.authError = '';
  const emailInput = (document.getElementById('uid')?.value || '').trim();
  const pwdInput = document.getElementById('pwd') ? document.getElementById('pwd').value : '';
  const roleOpt = state.selectedRole || 'DOCTOR';

  if (!emailInput) {
    state.authError = roleOpt === 'PATIENT' ? 'Please enter your HEALIX Patient ID.' : 'Please enter your professional Email, Registration ID, or Patient ID.';
    render();
    return;
  }

  // Patient Login Flow (Patient ID + OTP)
  if (roleOpt === 'PATIENT' || emailInput.toUpperCase().startsWith('HC04-PAT-')) {
    let cleanId = emailInput.trim().toUpperCase();
    if (!cleanId.startsWith('HC04-PAT-')) {
      cleanId = 'HC04-PAT-' + cleanId;
    }

    try {
      const otpRes = await API.req(`/api/patients/${encodeURIComponent(cleanId)}/request-otp`, { method: 'POST' });
      const otpData = await otpRes.json();
      if (!otpRes.ok) {
        state.authError = otpData.detail || 'Patient ID not recognized in HEALIX network.';
        render();
        return;
      }
      state.selectedPatientId = cleanId;
      state.patientOtpSent = true;
      state.tempDevOtp = otpData.dev_otp;
      render();
      return;
    } catch (e) {
      state.authError = 'Error connecting to emergency patient verification service.';
      render();
      return;
    }
  }

  // Standard Clinician / Admin Login Flow
  try {
    const res = await API.req('/api/auth/login', {
      method: 'POST',
      body: { email: emailInput, password: pwdInput }
    });
    const data = await res.json();

    if (!res.ok) {
      state.authError = data.detail || 'Authentication failed.';
      render();
      return;
    }

    // Check account status
    if (data.account_status === 'PENDING_VERIFICATION') {
      state.user = data;
      state.screen = 'pending_status';
      render();
      return;
    }

    if (data.account_status === 'SUSPENDED') {
      state.authError = 'Your professional account has been suspended by an administrator.';
      render();
      return;
    }

    API.setTokens(data.access_token, data.refresh_token);
    state.user = data;
    state.role = data.role;
    state.screen = 'app';
    state.view = data.role === 'ADMIN' ? 'admin_panel' : 'dashboard';
    fetchStats();
    fetchSources();
    fetchPatients();
    render();
  } catch (err) {
    state.authError = 'Unable to reach backend gateway. Ensure server is running on port 8000.';
    render();
  }
}

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });

const QUERY_STEPS = [
  'Authenticating requester',
  'Validating access policy',
  'Searching connected EHR networks',
  'Matching patient identity',
  'Retrieving records',
  'Normalizing formats',
  'Detecting conflicts',
  'Generating emergency summary'
];

async function runSecureEHRQuery(overrideId) {
  const patientInput = (overrideId || document.getElementById('patq')?.value || '').trim().toUpperCase();
  if (!patientInput) return;
  state.selectedPatientId = patientInput;
  state.summary = null;
  state.conflicts = [];
  state.queryRecords = [];
  state.queryRunning = true;
  state.queryDone = false;
  state.queryStep = 0;
  state.failedSources = [];
  render();

  const timer = setInterval(() => {
    if (state.queryStep < QUERY_STEPS.length - 1) {
      state.queryStep++;
      render();
    } else {
      clearInterval(timer);
    }
  }, 320);

  try {
    const res = await API.req('/api/ehr/query', {
      method: 'POST',
      body: { patient_id: patientInput, purpose: 'Emergency Treatment' }
    });
    const data = await res.json();
    
    // Concurrently fetch summary and conflicts
    await fetchEmergencySummary(patientInput);
    await fetchConflicts(patientInput);

    setTimeout(() => {
      state.queryRunning = false;
      state.queryDone = true;
      if (res.ok) {
        state.queryRecords = data.records || [];
        state.failedSources = data.failed_sources || [];
      }
      render();
    }, 2600);
  } catch (e) {
    state.queryRunning = false;
    alert('Error executing EHR query.');
    render();
  }
}

async function activateBreakGlass() {
  const reason = document.getElementById('ea-reason').value.trim() || 'Unconscious trauma patient, unable to provide consent';
  const caseId = document.getElementById('ea-case').value.trim() || 'EMG-2026-00124';
  
  try {
    const res = await API.req('/api/emergency/access', {
      method: 'POST',
      body: { patient_id: state.selectedPatientId, reason, case_id: caseId, break_glass: true }
    });
    if (res.ok) {
      state.emergencyAccessActive = true;
      state.emergencyTimer = 15 * 60;
      if (state.emergencyTimerHandle) clearInterval(state.emergencyTimerHandle);
      state.emergencyTimerHandle = setInterval(() => {
        state.emergencyTimer--;
        if (state.emergencyTimer <= 0) {
          deactivateBreakGlass();
          return;
        }
        if (state.view === 'emergencyaccess') render();
      }, 1000);
      render();
    }
  } catch (e) {
    alert('Error activating break-glass access.');
  }
}

async function deactivateBreakGlass() {
  try {
    await API.req(`/api/emergency/access/deactivate?patient_id=${state.selectedPatientId}`, { method: 'POST' });
  } catch (e) {}
  state.emergencyAccessActive = false;
  if (state.emergencyTimerHandle) clearInterval(state.emergencyTimerHandle);
  render();
}

async function resolveConflictAction(conflictId) {
  const chosen = prompt('Enter the verified clinical value for this field:');
  if (!chosen) return;
  const reason = prompt('Enter clinical justification / evidence note:');
  if (!reason) return;

  try {
    const res = await API.req(`/api/conflicts/${conflictId}/resolve`, {
      method: 'POST',
      body: { selected_value: chosen, resolution_notes: reason }
    });
    if (res.ok) {
      alert('Conflict resolved and permanently logged in audit trail.');
      fetchConflicts(state.selectedPatientId);
      fetchEmergencySummary(state.selectedPatientId);
    }
  } catch (e) {
    alert('Error resolving conflict.');
  }
}

function renderCurrentView() {
  switch (state.view) {
    case 'dashboard': return viewDashboard();
    case 'mypatients': return viewMyPatients();
    case 'search': return viewSearch();
    case 'addpatient': return viewAddPatient();
    case 'summary': return viewEmergencySummary();
    case 'conflicts': return viewConflicts();
    case 'records': return viewRecords();
    case 'network': return viewNetwork();
    case 'emergencyaccess': return viewEmergencyAccess();
    case 'access': return viewAccessPolicy();
    case 'audit': return viewAudit();
    case 'cases': return viewCases();
    case 'admin_panel': return viewAdminPanel();
    case 'architecture': return viewArchitecture();
    case 'settings': return viewSettings();
    case 'myhealth': return viewMyHealth();
    case 'visits': return viewVisitsPatient();
    case 'accesslog': return viewAccessLog();
    default: return viewDashboard();
  }
}

    <div class="modal" style="max-width:880px;width:95%;max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden;border:1px solid rgba(0,242,254,0.35);box-shadow:0 16px 48px rgba(0,0,0,0.9), 0 0 35px rgba(0,242,254,0.2);">
      
      <!-- Top Title Bar -->
      <div style="padding:16px 20px;background:rgba(10,14,23,0.95);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(0,242,254,0.12);border:1px solid rgba(0,242,254,0.3);display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:18px;">
            📄
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <h3 style="font-size:16px;margin:0;font-weight:700;letter-spacing:0.5px;">Medical Credential &amp; Licensing Verification</h3>
              ${statusBadge}
            </div>
            <div class="small" style="color:var(--text-muted);margin-top:2px;">
              File: <strong style="color:var(--teal);">${d.credentials_file || 'Document.pdf'}</strong> · Size: ${d.file_size_kb || 1420} KB · ${d.file_type || 'PDF'}
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" onclick="downloadCredentialDocument('${d.credentials_file || 'Credential.pdf'}')">📥 Download</button>
          <button class="btn btn-outline" style="font-size:12px;padding:5px 10px;" onclick="window.print()">🖨️ Print</button>
          <button class="close-btn" style="font-size:18px;margin-left:6px;" onclick="closeCredentialModal()">✕</button>
        </div>
      </div>

      <!-- Main Document Body (Scrollable) -->
      <div style="padding:20px;overflow-y:auto;background:radial-gradient(ellipse at top, rgba(13,23,38,0.7) 0%, rgba(5,9,16,0.95) 100%);">
        
        ${state.credentialDocLoading ? `
        <div style="text-align:center;padding:40px;color:var(--teal);">
          <div class="spinner" style="margin:0 auto 16px auto;"></div>
          <div>Verifying document integrity and querying State Medical Council registry...</div>
        </div>
        ` : `
        <!-- Certificate Canvas Preview -->
        <div style="background:#090d16;border:2px solid rgba(0,242,254,0.3);border-radius:8px;padding:28px 32px;position:relative;box-shadow:inset 0 0 40px rgba(0,0,0,0.8);background-image:radial-gradient(rgba(0,242,254,0.03) 1px, transparent 1px);background-size:20px 20px;">
          
          <!-- Guilloche Corner Ornaments -->
          <div style="position:absolute;top:8px;left:8px;font-size:12px;color:rgba(0,242,254,0.4);font-family:monospace;">⌜ HEALIX SECURE ⌝</div>
          <div style="position:absolute;top:8px;right:8px;font-size:12px;color:rgba(0,242,254,0.4);font-family:monospace;">⌞ LICENSED ⌟</div>

          <!-- Document Header -->
          <div style="text-align:center;border-bottom:1px solid rgba(0,242,254,0.2);padding-bottom:16px;">
            <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-weight:600;">
              ${d.licensing_authority || 'NATIONAL MEDICAL COMMISSION &amp; STATE MEDICAL COUNCIL'}
            </div>
            <div style="font-size:10px;letter-spacing:1.5px;color:var(--text-muted);margin-top:2px;">
              DEPARTMENT OF HEALTHCARE PROFESSIONAL LICENSING &amp; CREDENTIAL REGISTRY
            </div>
            <h2 style="font-size:22px;font-family:'Orbitron',sans-serif;letter-spacing:1px;color:#fff;margin:12px 0 4px 0;text-shadow:0 0 10px rgba(0,242,254,0.3);">
              ${d.role === 'EMT' ? 'CERTIFICATE OF PARAMEDIC REGISTRATION' : 'CERTIFICATE OF MEDICAL REGISTRATION'}
            </h2>
            <div class="small" style="color:var(--text-muted);font-style:italic;">
              Issued under the National Healthcare Interoperability &amp; Clinical Governance Act
            </div>
          </div>

          <!-- Document Recipient Body -->
          <div style="margin:22px 0;text-align:center;">
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">This is to officially certify that the medical practitioner / clinician</p>
            <div style="font-size:22px;font-weight:700;color:var(--teal);letter-spacing:0.8px;margin:8px 0;">
              ${d.full_name}
            </div>
            <p style="font-size:12px;color:#cbd5e1;max-width:580px;margin:0 auto;line-height:1.6;">
              having duly submitted verified qualifications, clinical board certifications, and identity proofs, is formally enrolled on the Medical Register and granted verified practice privileges.
            </p>
          </div>

          <!-- Certificate Metadata Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:14px 18px;margin:18px 0;">
            <div>
              <div class="small" style="color:var(--text-muted);">Registration / License No.</div>
              <div class="mono" style="font-size:14px;font-weight:700;color:#38bdf8;margin-top:2px;">${d.reg_number}</div>
            </div>
            <div>
              <div class="small" style="color:var(--text-muted);">Licensing Council</div>
              <div style="font-size:13px;font-weight:600;color:#fff;margin-top:2px;">${d.licensing_authority}</div>
            </div>
            <div>
              <div class="small" style="color:var(--text-muted);">Designated Specialty</div>
              <div style="font-size:13px;font-weight:600;color:#fff;margin-top:2px;">${d.department || 'Emergency & Critical Care'}</div>
            </div>
            <div>
              <div class="small" style="color:var(--text-muted);">Hospital / Network Affiliation</div>
              <div style="font-size:13px;font-weight:600;color:#fff;margin-top:2px;">${d.organization_name}</div>
            </div>
            <div>
              <div class="small" style="color:var(--text-muted);">Clinician Contact</div>
              <div style="font-size:12px;color:#cbd5e1;margin-top:2px;">${d.email}</div>
            </div>
            <div>
              <div class="small" style="color:var(--text-muted);">License Validity Window</div>
              <div style="font-size:12px;font-weight:600;color:#4ade80;margin-top:2px;">Issued: ${d.issued_date || '15 Jan 2024'} · Valid to: ${d.valid_until || '31 Dec 2029'}</div>
            </div>
          </div>

          <!-- Bottom Cryptographic Seal & Live Council Status -->
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid rgba(0,242,254,0.2);padding-top:18px;margin-top:18px;">
            <div style="display:flex;align-items:center;gap:14px;">
              <div style="background:#fff;padding:4px;border-radius:6px;display:inline-block;">
                ${qrSvg}
              </div>
              <div>
                <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--teal);">CRYPTOGRAPHIC VERIFICATION SEAL</div>
                <div class="mono small" style="color:var(--text-muted);font-size:11px;margin-top:2px;">Signature: ${d.digital_signature || 'SHA256:VERIFIED-SIGNATURE'}</div>
                <div class="small" style="color:#4ade80;margin-top:4px;">
                  ✓ Council Registry Cross-Match: <strong>${d.registry_cross_reference?.council_status || 'AUTHENTICATED & ACTIVE'}</strong>
                </div>
                <div class="small" style="color:var(--text-muted);">
                  Disciplinary Records: <span style="color:#38bdf8;">${d.registry_cross_reference?.disciplinary_sanctions || 'CLEARED - NO ACTIONS'}</span>
                </div>
              </div>
            </div>

            <div style="text-align:right;">
              <div style="font-family:'Brush Script MT', cursive, sans-serif;font-size:24px;color:rgba(0,242,254,0.8);letter-spacing:1px;transform:rotate(-3deg);display:inline-block;margin-bottom:2px;">
                Dr. Arvind Saxena
              </div>
              <div class="small" style="border-top:1px solid rgba(255,255,255,0.2);padding-top:2px;color:var(--text-muted);font-weight:600;">
                Registrar &amp; Secretary General
              </div>
              <div class="small" style="font-size:10px;color:rgba(0,242,254,0.6);">
                National Medical Licensure Board
              </div>
            </div>
          </div>
          
        </div>
        `}

        ${d.rejection_reason ? `
        <div class="alert-box" style="margin-top:16px;border-color:var(--red);">
          <div style="color:var(--red);font-weight:700;">Rejection / Suspension Note:</div>
          <div class="small" style="margin-top:4px;color:#fca5a5;">${d.rejection_reason}</div>
        </div>
        ` : ''}

      </div>

      <!-- Action Decision Footer -->
      <div style="padding:14px 20px;background:rgba(10,14,23,0.98);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <span class="small" style="color:var(--text-muted);">Administrative Action for <strong>${d.full_name}</strong> (${d.reg_number}):</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          ${d.verification_status === 'PENDING_VERIFICATION' ? `
            <button class="btn btn-primary" style="font-size:12px;padding:6px 14px;" onclick="handleAdminAction('${d.id}','VERIFY')">
              ✓ Approve &amp; Verify Clinician
            </button>
            <button class="btn btn-danger" style="font-size:12px;padding:6px 14px;" onclick="handleAdminAction('${d.id}','REJECT')">
              ✗ Reject Application
            </button>
          ` : d.verification_status === 'VERIFIED' ? `
            <button class="btn btn-danger" style="font-size:12px;padding:6px 14px;" onclick="handleAdminAction('${d.id}','SUSPEND')">
              ⚠️ Suspend Credentials
            </button>
          ` : `
            <button class="btn btn-outline" style="font-size:12px;padding:6px 14px;color:var(--teal);border-color:var(--teal);" onclick="handleAdminAction('${d.id}','VERIFY')">
              ✓ Re-Verify Credentials
            </button>
          `}
          <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;" onclick="closeCredentialModal()">Close</button>
        </div>
      </div>

    </div>
  </div>
  `;
}

// Initial bootstrap
initApp();
</script>
</body>
</html>
